# Replace both /mnt/tank paths with your actual pool/dataset paths.
# Build the image in the source dataset first, or load a prebuilt image.
services:
  emerald-boost:
    build: /mnt/tank/apps/emerald-boost/source
    image: emerald-boost:0.3.0
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      HEATER_DRIVER: demo
      COOKIE_SECURE: "true"
      # Set this to your HTTPS reverse proxy's actual source IP.
      FORWARDED_ALLOW_IPS: "127.0.0.1"
      EMERALD_DEVICE_ID: ""
      TZ: Australia/Melbourne
      DATA_DIR: /data
    volumes:
      - /mnt/tank/apps/emerald-boost/data:/data
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
