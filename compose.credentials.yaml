# Optional: combine with compose.yaml or compose.truenas.yaml after creating the key.
services:
  emerald-boost:
    environment:
      CREDENTIAL_KEY_FILE: /run/secrets/emerald_key
    secrets:
      - emerald_key

secrets:
  emerald_key:
    file: ${CREDENTIAL_KEY_PATH:?Set CREDENTIAL_KEY_PATH to the separate private key file}
