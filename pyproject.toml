[project]
name = "emerald-boost"
version = "0.3.2"
description = "A small, persistent boost scheduler for Emerald hot-water heat pumps."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1",
  "emerald-hws>=0.1,<1",
  "tzdata>=2025.2",
  "cryptography>=46,<51",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
